name: Buat Aplikasi APK Winamp

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04  # Mengunci ke versi Ubuntu yang paling stabil untuk Android

    steps:
    - name: Ambil Kode Program
      uses: actions/checkout@v4

    - name: Siapkan Lingkungan Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Siapkan Java JDK Mandiri
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instal Alat Perakitan Linux
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev lldd scons ccze
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    - name: Cetak File APK Final
      run: |
        # Memaksa persetujuan lisensi dan menjalankan pembungkusan aman
        yes y | buildozer --allow-root -v android debug

    - name: Simpan File APK Siap Unduh
      uses: actions/upload-artifact@v4
      with:
        name: Aplikasi-Winamp-Mobile-Anda
        path: bin/*.apk
